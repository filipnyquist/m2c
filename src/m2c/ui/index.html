<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m2c traffic</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #ffffff; --line: #e4e4e0; --text: #1d1d1b; --muted: #6b6b66; --accent: #2f6fdb;
  --sel: #e8f0fd; --ok: #2b8a3e; --warn: #b7791f; --bad: #c92a2a; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1d1d1b; --line: #2f2f2c; --text: #e9e9e4; --muted: #9a9a92; --accent: #6ea0ff; --sel: #24324a;
          --ok: #69db7c; --warn: #fcc419; --bad: #ff8787; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
#app { height: 100%; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
button, input { font: inherit; color: inherit; }
header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 14px; margin: 0; font-weight: 600; }
header .stats { color: var(--muted); font-size: 12px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#q { flex: 2; min-width: 120px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-family: var(--mono); font-size: 12px; }
.btn { padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer; }
.btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
main { display: grid; grid-template-columns: 200px minmax(0, 1.5fr) minmax(340px, 1fr); height: calc(100% - 45px); }
aside { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 12px 4px; }
.sess { padding: 4px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
.sess:hover { background: var(--sel); }
.sess.tool { color: var(--muted); font-size: 12px; padding-left: 24px; }
.sess .count { color: var(--muted); font-variant-numeric: tabular-nums; }
#list { overflow: auto; border-right: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; table-layout: fixed; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
td { padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
tr.row { cursor: pointer; }
tr.row:hover { background: var(--sel); }
tr.row.sel { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
tr.row.new { animation: flash 1.2s ease-out; }
tr.row.open td:nth-child(5) { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@keyframes flash { from { background: color-mix(in srgb, var(--accent) 25%, transparent); } }
.s2 { color: var(--ok); } .s3 { color: var(--muted); } .s4 { color: var(--warn); } .s5, .serr { color: var(--bad); }
.tag { display: inline-block; font-size: 10px; padding: 0 4px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; }
#more { display: block; margin: 8px auto; }
#detail { overflow: auto; padding: 0 12px 24px; }
#detail .empty { color: var(--muted); padding: 24px 0; }
.title { font-family: var(--mono); font-size: 12px; word-break: break-all; padding: 10px 0 4px; }
.meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; padding-bottom: 8px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 4px 0 8px; position: sticky; top: 0; background: var(--bg); padding-top: 4px; }
.tabs .btn { border-radius: 6px 6px 0 0; border-bottom: none; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 4px; font-weight: 600; }
.hdrs { font-family: var(--mono); font-size: 12px; }
.hdrs div { word-break: break-all; }
.hdrs b { font-weight: 600; }
pre { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-all; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 4px 0; max-height: 70vh; overflow: auto; }
.note { color: var(--muted); font-size: 12px; }
.ev { border-bottom: 1px solid var(--line); padding: 4px 0; font-family: var(--mono); font-size: 12px; }
.ev .at { color: var(--muted); margin-right: 8px; }
.ev.client .dir { color: var(--accent); } .ev.server .dir { color: var(--ok); }
img.preview { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; }
#login { max-width: 420px; margin: 15vh auto; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
#login input { width: 100%; padding: 6px 8px; margin: 8px 0; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-family: var(--mono); }
#err { color: var(--bad); padding: 6px 12px; display: none; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: auto 45vh auto; height: auto; }
  aside { max-height: 30vh; border-right: none; border-bottom: 1px solid var(--line); }
  #list { border-right: none; }
  header { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div id="app" hidden>
  <header>
    <h1>m2c</h1>
    <input id="q" placeholder="filter: tool:curl status:5xx host:*.example.com has:sse &quot;text&quot;" spellcheck="false" autocomplete="off">
    <button class="btn on" id="live" title="Follow new flows">Live</button>
    <button class="btn" id="har" title="Download the filtered flows as HAR">HAR</button>
    <span class="stats" id="stats"></span>
  </header>
  <div id="err"></div>
  <main>
    <aside id="sessions"></aside>
    <section id="list">
      <table>
        <thead><tr><th style="width:46px">#</th><th style="width:96px">time</th><th style="width:140px">session / tool</th><th style="width:54px">method</th><th style="width:44px">status</th><th>url</th><th style="width:54px">size</th><th style="width:48px">ms</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <button class="btn" id="more" hidden>Load older</button>
    </section>
    <section id="detail"><div class="empty">Select a flow.</div></section>
  </main>
</div>
<div id="login" hidden>
  <h3>m2c API token</h3>
  <p class="note">Paste the admin token (printed by <code>m2c proxy</code>, also in &lt;data&gt;/api.json) or <code>&lt;session&gt;:&lt;proxy token&gt;</code>.</p>
  <input id="tok" type="password" autocomplete="off">
  <button class="btn" id="go">Open</button>
</div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "text") e.textContent = v;
    else e.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) e.append(kid);
  return e;
};
let token = "";
function readToken() {
  const m = location.hash.match(/token=([^&]+)/);
  if (m) {
    token = decodeURIComponent(m[1]);
    try { sessionStorage.setItem("m2c-token", token); } catch (e) { /* storage blocked: memory only */ }
    history.replaceState(null, "", location.pathname);
    return true;
  }
  try { token = token || sessionStorage.getItem("m2c-token") || ""; } catch (e) {}
  return false;
}
readToken();
window.addEventListener("hashchange", () => { if (readToken()) start(); });

const state = { q: "", live: true, rows: new Map(), selected: null, oldest: null, tail: null, tab: "resp" };

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { Authorization: "Bearer " + token, ...(opts.headers || {}) } });
  if (res.status === 401) {
    state.authFailed = true;
    if (state.tail) state.tail.abort();
    showLogin("That token was not accepted (the proxy makes a new one per data directory; see <data>/api.json).");
    throw new Error("unauthorized");
  }
  if (!res.ok) {
    let msg = res.status + "";
    try { msg = (await res.json()).error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res;
}
const json = async (path) => (await api(path)).json();
function showErr(msg) { const e = $("#err"); e.textContent = msg || ""; e.style.display = msg ? "block" : "none"; }

function showLogin(msg) {
  $("#app").hidden = true; $("#login").hidden = false;
  if (msg) $("#login .note").textContent = msg;
  $("#tok").focus();
}
$("#go").onclick = () => { token = $("#tok").value.trim(); try { sessionStorage.setItem("m2c-token", token); } catch (e) {} start(); };
$("#tok").onkeydown = (e) => { if (e.key === "Enter") $("#go").click(); };

const fmtSize = (n) => { n = +n || 0; if (n < 1024) return n + "B"; for (const u of ["K", "M", "G"]) { n /= 1024; if (n < 1024 || u === "G") return n.toFixed(1) + u; } };
const fmtTime = (ms) => { if (!ms) return "-"; const d = new Date(ms); return d.toLocaleTimeString([], { hour12: false }) + "." + String(d.getMilliseconds()).padStart(3, "0"); };
const statusClass = (f) => f.status ? "s" + String(f.status)[0] : (f.error ? "serr" : "");

function rowFor(f, isNew) {
  const who = el("td", { title: `${f.session} / ${f.tool}${f.call_id ? " #" + f.call_id : ""}` }, `${f.session} / ${f.tool}`);
  if (f.call_id) who.append(el("span", { class: "tag", text: f.call_id }));
  const url = el("td", { title: f.url || (f.host + f.path) }, f.host + f.path);
  if (f.resp_capture === "sse") url.prepend(el("span", { class: "tag", text: "sse" }), " ");
  if (f.resp_capture === "websocket") url.prepend(el("span", { class: "tag", text: "ws" }), " ");
  const tr = el("tr", { class: "row" + (isNew ? " new" : "") + (f.open ? " open" : ""), onclick: () => select(f.n) },
    el("td", { text: f.n }), el("td", { text: fmtTime(f.ts) }), who, el("td", { text: f.method }),
    el("td", { class: f.open ? "s3" : statusClass(f), text: f.open ? "…" : (f.status || (f.error ? "ERR" : "-")), title: f.open ? "still streaming" : (f.error || "") }), url,
    el("td", { text: fmtSize(f.resp_body_size) }), el("td", { text: f.duration_ms }));
  tr.dataset.n = f.n;
  if (state.selected === f.n) tr.classList.add("sel");
  return tr;
}

async function loadFlows(reset) {
  showErr("");
  const params = new URLSearchParams({ q: state.q, limit: 200 });
  if (!reset && state.oldest) params.set("cursor", state.oldest);
  let page;
  try { page = await json("/v1/flows?" + params); } catch (e) { return showErr(e.message); }
  const tbody = $("#rows");
  if (reset) { tbody.replaceChildren(); state.rows.clear(); }
  for (const f of page.flows) {
    if (state.rows.has(f.n)) continue;
    state.rows.set(f.n, f);
    tbody.append(rowFor(f));
  }
  state.oldest = page.flows.length ? page.flows[page.flows.length - 1].n : state.oldest;
  $("#more").hidden = !page.next;
}

async function loadSessions() {
  let rows;
  try { rows = await json("/v1/sessions"); } catch (e) { return; }
  const by = new Map();
  for (const r of rows) { if (!by.has(r.session)) by.set(r.session, []); by.get(r.session).push(r); }
  const box = $("#sessions");
  box.replaceChildren(el("h2", { text: "Sessions" }));
  box.append(el("div", { class: "sess", onclick: () => setQuery("") }, el("span", { text: "all" })));
  for (const [s, tools] of by) {
    const total = tools.reduce((a, t) => a + t.flows, 0);
    box.append(el("div", { class: "sess", onclick: () => setQuery("session:" + s) }, el("span", { text: s }), el("span", { class: "count", text: total })));
    for (const t of tools) box.append(el("div", { class: "sess tool", onclick: () => setQuery(`session:${s} tool:${t.tool}`) }, el("span", { text: t.tool }), el("span", { class: "count", text: t.flows })));
  }
}

async function loadStats() {
  try { state.scan = await json("/v1/scan"); renderStats(); } catch (e) {}
}

function renderStats() {
  const s = state.scan || {}, l = state.liveStats || {};
  const parts = [`scan ${s.scan_id || l.scan_id || "-"}`, `${s.flows ?? "-"} flows`, `${s.sessions ?? "-"} sessions`, `${s.tools ?? "-"} tools`, `${s.hosts ?? "-"} hosts`];
  if (l.open) parts.push(`${l.open} streaming`);
  if (l.queued) parts.push(`${l.queued} queued`);
  if (s.scope) parts.push(`scoped to ${s.scope}`);
  $("#stats").textContent = parts.join(" · ") + (l.dropped ? ` · ${l.dropped} ROWS DROPPED` : "");
}

function setQuery(q) { $("#q").value = q; state.q = q; refresh(); }

// Read a text/event-stream over fetch (EventSource cannot send the Authorization header).
async function readSse(path, signal, onEvent) {
  const res = await api(path, { signal });
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) return;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      let kind = "message", id = null; const data = [];
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) kind = line.slice(6).trim();
        else if (line.startsWith("data:")) data.push(line.slice(5).trim());
        else if (line.startsWith("id:")) id = line.slice(3).trim();
      }
      if (data.length) onEvent(kind, JSON.parse(data.join("\n")), id);
    }
  }
}

function upsertRow(f, isOpen) {
  const old = document.querySelector(`tr.row[data-n="${f.n}"]`);
  const known = state.rows.get(f.n);
  if (!isOpen && known && !known.open && old) return;
  state.rows.set(f.n, isOpen ? { ...f, open: true } : f);
  const tr = rowFor(state.rows.get(f.n), !old);
  if (old) old.replaceWith(tr);
  else $("#rows").prepend(tr);
  if (!isOpen) scheduleSide();
  if (!isOpen && state.selected === f.n && state.openView === f.n) setTimeout(() => state.selected === f.n && select(f.n), 300);
}

// A reconnect passes the last event id as `since`, so flows that finished in between are replayed; `resync` (the
// proxy restarted, or more flows finished than the server keeps) or a reconnect without an id reloads the list.
async function startTail(reconnect) {
  if (state.tail) state.tail.abort();
  if (!state.live) return;
  const ctl = new AbortController();
  state.tail = ctl;
  const params = { q: state.q };
  if (reconnect && state.tailCursor) params.since = state.tailCursor;
  else if (reconnect) loadFlows(true);
  try {
    await readSse("/v1/tail?" + new URLSearchParams(params), ctl.signal, (kind, item, id) => {
      state.retry = 0;
      if (id) state.tailCursor = id;
      if (kind === "flow") upsertRow(item, false);
      else if (kind === "open") upsertRow(item, true);
      else if (kind === "stats") showLive(item);
      else if (kind === "resync") loadFlows(true);
    });
  } catch (e) {
    if (e.name === "AbortError") return;
  }
  if (state.live && state.tail === ctl && !state.authFailed) {
    state.retry = Math.min((state.retry || 1000) * 2, 30000);
    setTimeout(() => state.tail === ctl && startTail(true), state.retry);
  }
}

function showLive(s) {
  state.liveStats = s;
  renderStats();
}

let sideTimer = null;
function scheduleSide() { if (!sideTimer) sideTimer = setTimeout(() => { sideTimer = null; loadSessions(); loadStats(); }, 1500); }

function headersBlock(title, pairs) {
  if (!pairs) return [];
  const box = el("div", { class: "hdrs" });
  for (const [k, v] of pairs || []) box.append(el("div", {}, el("b", { text: k }), ": " + v));
  return [el("h3", { text: title }), box];
}

async function bodyBlock(n, side, flow) {
  const stored = flow[side + "_body_stored"], wire = flow[side + "_body_size"];
  const parts = [el("h3", { text: `${side === "req" ? "Request" : "Response"} body · ${fmtSize(wire)} on the wire` +
    (flow[side + "_body_decoded"] ? " · decoded" : "") + (flow[side + "_body_truncated"] ? " · truncated" : "")
    + ` · capture ${flow[side + "_capture"]}` })];
  if (!stored) { parts.push(el("div", { class: "note", text: "No body stored." })); return parts; }
  const res = await api(`/v1/flows/${n}/body/${side}?max=262144`);
  const ctype = res.headers.get("X-M2C-Content-Type") || "";
  const bytes = new Uint8Array(await res.arrayBuffer());
  if (/^image\/(png|jpeg|gif|webp|avif)/.test(ctype)) {
    parts.push(el("img", { class: "preview", src: URL.createObjectURL(new Blob([bytes], { type: ctype.split(";")[0] })) }));
  } else {
    let text = null;
    try { text = new TextDecoder("utf-8", { fatal: true }).decode(bytes); } catch (e) {}
    if (text !== null) {
      if (/json/.test(ctype) || /^\s*[\[{]/.test(text)) { try { text = JSON.stringify(JSON.parse(text), null, 2); } catch (e) {} }
      parts.push(el("pre", { text }));
    } else {
      const lines = [];
      for (let i = 0; i < Math.min(bytes.length, 4096); i += 16) {
        const row = bytes.slice(i, i + 16);
        lines.push(i.toString(16).padStart(6, "0") + "  " + Array.from(row, (b) => b.toString(16).padStart(2, "0")).join(" ").padEnd(48) + "  " + Array.from(row, (b) => b >= 32 && b < 127 ? String.fromCharCode(b) : ".").join(""));
      }
      parts.push(el("pre", { text: lines.join("\n") + (bytes.length > 4096 ? `\n… ${bytes.length - 4096} more bytes` : "") }));
    }
  }
  if (stored > bytes.length) parts.push(el("div", { class: "note", text: `Showing ${fmtSize(bytes.length)} of ${fmtSize(stored)} stored.` }));
  parts.push(el("a", { class: "note", href: "#", onclick: (e) => { e.preventDefault(); download(`/v1/flows/${n}/body/${side}`, `${n}-${side}.bin`); } }, "Download"));
  return parts;
}

async function download(path, name) {
  const blob = await (await api(path)).blob();
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
}

async function select(n) {
  state.selected = n;
  for (const tr of document.querySelectorAll("tr.row.sel")) tr.classList.remove("sel");
  const tr = document.querySelector(`tr.row[data-n="${n}"]`);
  if (tr) tr.classList.add("sel");
  const box = $("#detail");
  let flow;
  try { flow = await json(`/v1/flows/${n}`); } catch (e) { box.replaceChildren(el("div", { class: "empty", text: e.message })); return; }
  if (state.selected !== n) return;
  if (state.flowLive) { state.flowLive.abort(); state.flowLive = null; }
  state.openView = null;
  if (flow.pending && flow.open) return liveDetail(n, flow);
  if (flow.pending) { box.replaceChildren(el("div", { class: "empty", text: `#${n} is still being written…` })); setTimeout(() => state.selected === n && select(n), 400); return; }
  const meta = el("div", { class: "meta" },
    el("span", { text: `${flow.status} ${flow.reason}` }), el("span", { text: `${flow.duration_ms} ms (ttfb ${flow.ttfb_ms})` }),
    el("span", { text: `${flow.session} / ${flow.tool}${flow.call_id ? " #" + flow.call_id : ""}` }),
    el("span", { text: `via ${flow.identity_source}` }), flow.tag ? el("span", { text: `tag ${flow.tag}` }) : null,
    el("span", { text: flow.tls ? `${flow.tls_version} sni=${flow.sni} ${flow.alpn}` : "plain HTTP" }),
    el("span", { text: `server ${flow.server_ip.replace("::ffff:", "")}:${flow.server_port}` }), el("span", { text: fmtTime(flow.ts) }));
  const tabs = [["resp", "Response"], ["req", "Request"]];
  if (flow.resp_capture === "sse") tabs.push(["sse", `SSE (${flow.sse_event_count})`]);
  if (flow.resp_capture === "websocket") tabs.push(["ws", `WebSocket (${flow.ws_message_count})`]);
  tabs.push(["curl", "curl"]);
  if (!tabs.some(([k]) => k === state.tab)) state.tab = "resp";
  const content = el("div");
  const tabBar = el("div", { class: "tabs" }, ...tabs.map(([k, label]) => el("button", { class: "btn" + (k === state.tab ? " on" : ""), onclick: () => { state.tab = k; select(n); } }, label)));
  const head = [el("div", { class: "title", text: `#${flow.n}  ${flow.method} ${flow.url}` }), meta];
  if (flow.error) head.push(el("div", { class: "s5", text: `error (${flow.error_kind}): ${flow.error}` }));
  box.replaceChildren(...head, tabBar, content);
  try {
    if (state.tab === "resp") content.append(...headersBlock("Response headers", flow.resp_headers), ...headersBlock("Trailers", flow.resp_trailers.length ? flow.resp_trailers : null), ...(await bodyBlock(n, "resp", flow)));
    if (state.tab === "req") content.append(...headersBlock("Request headers", flow.req_headers), ...(await bodyBlock(n, "req", flow)));
    if (state.tab === "sse") {
      for (const ev of await json(`/v1/flows/${n}/sse?limit=2000`))
        content.append(el("div", { class: "ev" }, el("span", { class: "at", text: `+${ev.ms_since_req}ms` }), ev.event ? el("span", { class: "tag", text: ev.event }) : null, " ", ev.data + (ev.partial ? "  (partial)" : "") + (ev.truncated ? "  (truncated)" : "")));
    }
    if (state.tab === "ws") {
      for (const m of await json(`/v1/flows/${n}/ws?limit=2000`))
        content.append(el("div", { class: "ev " + (m.from_client ? "client" : "server") }, el("span", { class: "at", text: fmtTime(m.ts) }), el("span", { class: "dir", text: m.from_client ? "→ " : "← " }), m.text || `<${m.size} bytes ${m.opcode}> ${m.base64.slice(0, 120)}`));
      content.append(el("div", { class: "note", text: `closed ${flow.ws_close_code} ${flow.ws_close_reason} by ${flow.ws_closed_by_client ? "client" : "server"}` }));
    }
    if (state.tab === "curl") content.append(el("pre", { text: await (await api(`/v1/flows/${n}/curl`)).text() }));
  } catch (e) { content.append(el("div", { class: "s5", text: e.message })); }
}

async function liveDetail(n, f) {
  const box = $("#detail");
  state.openView = n;
  const count = el("span", { text: "" });
  const list = el("div");
  box.replaceChildren(
    el("div", { class: "title", text: `#${f.n}  ${f.method} ${f.url}` }),
    el("div", { class: "meta" }, el("span", { class: "s3", text: `streaming ${f.resp_capture}` }), el("span", { text: `${f.session} / ${f.tool}${f.call_id ? " #" + f.call_id : ""}` }), el("span", { text: fmtTime(f.ts) }), count),
    el("h3", { text: f.resp_capture === "websocket" ? "WebSocket messages (live)" : f.resp_capture === "sse" ? "SSE events (live)" : "Body is streaming; details when it ends" }),
    list);
  const ctl = new AbortController();
  state.flowLive = ctl;
  const seen = new Map();
  const render = (kind, item) => kind === "sse"
    ? el("div", { class: "ev" }, el("span", { class: "at", text: `+${item.ms_since_req}ms` }), item.event ? el("span", { class: "tag", text: item.event }) : null, " ", item.data + (item.partial ? "  (partial)" : ""))
    : el("div", { class: "ev " + (item.from_client ? "client" : "server") }, el("span", { class: "at", text: fmtTime(item.ts) }), el("span", { class: "dir", text: item.from_client ? "→ " : "← " }), item.text || `<${item.size} bytes ${item.opcode}> ${item.base64.slice(0, 120)}`);
  const add = (kind, item) => {
    const old = seen.get(item.seq);
    if (old && !(old.preview && !item.preview)) return;  // a full copy replaces an in-memory preview
    const node = render(kind, item);
    node.dataset.seq = item.seq;
    node.preview = item.preview;
    seen.set(item.seq, node);
    if (old) { old.replaceWith(node); return; }
    const later = [...list.children].find((c) => +c.dataset.seq > item.seq);
    list.insertBefore(node, later || null);
    count.textContent = `${seen.size} so far`;
  };
  const child = f.resp_capture === "websocket" ? "ws" : f.resp_capture === "sse" ? "sse" : null;
  // Subscribe first, then backfill what was already written, so nothing falls between the two.
  let backfilled = false;
  const backfill = () => {
    if (backfilled || !child) return;
    backfilled = true;
    json(`/v1/flows/${n}/${child}?limit=2000`).then((rows) => rows.forEach((r) => add(child, r))).catch(() => {});
  };
  try {
    await readSse(`/v1/flows/${n}/live`, ctl.signal, (kind, item) => {
      if (kind === "open") { backfill(); return; }
      if (kind === "sse" || kind === "ws") {
        add(kind, item);
      } else if (kind === "lost") {
        // This view fell behind: fetch the gap once the writer has stored it (the final view loads at the end anyway).
        if (child) setTimeout(() => json(`/v1/flows/${n}/${child}?after=${item.after}&limit=2000`).then((rows) => rows.forEach((r) => add(child, r))).catch(() => {}), 800);
        return;
      } else if (kind === "end") {
        ctl.abort();
        setTimeout(() => state.selected === n && select(n), 300);
        return;
      } else return;
      const d = $("#detail");
      if (d.scrollHeight - d.scrollTop - d.clientHeight < 80) d.scrollTop = d.scrollHeight;
    });
  } catch (e) { /* aborted or closed */ }
}

function refresh() { state.oldest = null; state.tailCursor = null; loadFlows(true); startTail(); }

let qTimer = null;
$("#q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = $("#q").value.trim(); refresh(); }, 350); });
$("#live").onclick = () => { state.live = !state.live; $("#live").classList.toggle("on", state.live); if (state.live) refresh(); else if (state.tail) state.tail.abort(); };
$("#more").onclick = () => loadFlows(false);
$("#har").onclick = () => download("/v1/har?" + new URLSearchParams({ q: state.q, limit: 1000 }), "m2c.har").catch((e) => showErr(e.message));
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  if (e.key === "j" || e.key === "k") {
    const rows = [...document.querySelectorAll("tr.row")];
    const i = rows.findIndex((r) => +r.dataset.n === state.selected);
    const next = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === "j" ? 1 : -1)))];
    if (next) { select(+next.dataset.n); next.scrollIntoView({ block: "nearest" }); }
  }
});

let statsTimer = null;
async function start() {
  if (!token) return showLogin();
  state.authFailed = false;
  try { await json("/v1/scan"); } catch (e) { return; }
  clearInterval(statsTimer);
  statsTimer = setInterval(loadStats, 30000);
  $("#login").hidden = true; $("#app").hidden = false;
  loadStats(); loadSessions(); refresh();
}
start();
</script>
